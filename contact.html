<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="form.css" />
    <title>Contact Player - falLUDOfield</title>
  </head>
  <body>
    <div class="container">
      <form id="contact" action="" method="post">
        <div id="top">
          <h3>Salman Ashraf</h3>
          <img src="user.png" alt="Player Image" id="userImg" />
          <h4>salman.ashraf@student.manchester.ac.uk</h4>
        </div>
        <fieldset>
          <input
            placeholder="Your Web Site starts with http://"
            type="url"
            tabindex="4"
          />
        </fieldset>
        <fieldset>
          <input placeholder="Subject" type="url" tabindex="4" required />
        </fieldset>
        <fieldset>
          <textarea
            placeholder="Type your Message Here...."
            tabindex="5"
            required
          ></textarea>
        </fieldset>
        <fieldset>
          <button
            name="submit"
            type="submit"
            id="contact-submit"
            data-submit="...Sending"
          >
            Submit
          </button>
        </fieldset>
      </form>
    </div>
  </body>
</html>
