<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>FalLUDOfields</title>
        <link rel="stylesheet" href="gameBoard.css">            
</head>



<body>
    <div class = "leftButton">
        <button type= "button" class = "logOutButton"> Log Out</button> 
    </div>

    <div class = "gameboard">
<!--Colour boxes-->
        <!--Yellow Box-->
        <div class = "yellow">
            <div class = "inside">
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
            </div>
        </div>

        <!--Top Moving spaces-->
        <div class = "verticalSpaces">
            <div class = "leftSpaces">
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces green"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
            </div>
            <div class = "middleSpaces">
                <div class = "spaces"></div>
                <div class = "spaces green"></div>
                <div class = "spaces green"></div>
                <div class = "spaces green"></div>
                <div class = "spaces green"></div>
                <div class = "spaces green"></div>
            </div>
            <div class = "rightSpaces">
                <div class = "spaces"></div>
                <div class = "spaces green"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
            </div>
        </div>

        <!--Green Box-->
        <div class = "green">
            <div class = "inside">
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
            </div>
        </div>

        <div class = "horizontalSpaces">
            <div class = "leftRows">
                    <div class = "topRow">
                        <div class = "spaces"></div>
                        <div class = "spaces yellow"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                    </div>
                    <div class = "topRow">
                        <div class = "spaces"></div>
                        <div class = "spaces yellow"></div>
                        <div class = "spaces yellow"></div>
                        <div class = "spaces yellow"></div>
                        <div class = "spaces yellow"></div>
                        <div class = "spaces yellow"></div>
                    </div>
                    <div class = "topRow">
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces yellow"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                    </div>
                </div>

            <div class = "rightRows">
                    <div class = "topRow">
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces red"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        </div>
                    <div class = "topRow">
                        <div class = "spaces red"></div>
                        <div class = "spaces red"></div>
                        <div class = "spaces red"></div>
                        <div class = "spaces red"></div>
                        <div class = "spaces red"></div>
                        <div class = "spaces"></div>
                        </div>
                    <div class = "topRow">
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces"></div>
                        <div class = "spaces red"></div>
                        <div class = "spaces"></div>
                    </div>
            </div>

        </div>

        <!--Blue Box-->
        <div class = "blue">
            <div class = "inside">
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
            </div>
        </div>

        <!--Bottom Moving Spaces-->
        <div class = "verticalSpaces">
            <div class = "leftSpaces">
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces blue"></div>
                <div class = "spaces"></div>
            </div>
            <div class = "middleSpaces">
                <div class = "spaces blue"></div>
                <div class = "spaces blue"></div>
                <div class = "spaces blue"></div>
                <div class = "spaces blue"></div>
                <div class = "spaces blue"></div>
                <div class = "spaces"></div>
            </div>
            <div class = "rightSpaces">
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
                <div class = "spaces blue" ></div>
                <div class = "spaces"></div>
                <div class = "spaces"></div>
            </div>
        </div>

        <!--Red Box-->
        <div class = "red">
            <div class = "inside">
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
                <div class = "innerSpace"></div>
            </div>
        </div>

        


    </div> 
    
    <button type="button" class = "leaderboardButton">Leaderboard</button>
    
    <div class="rollMechanism">
        <div class="bothDice">
            <div id = "dice"></div>
            <div id = "dice2"></div>  
        </div>
        <button type="button" class= "rollDiceButton" onclick="rollDice()">Roll Dice</button>
    </div>
    <script src="gameboard.js"></script>
</body>





</html>
