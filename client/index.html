<!DOCTYPE html>
<html>
<head>
  <script src="script.js" type="module"></script>
  <style>
    body {
        margin: 0 auto;
        display: flex;
        justify-content: center;
        flex-direction: column;
        height: 100vh;
        width: 90%;
        max-width: 1200px
    }
    
    #message-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 500px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f2f2f2;
      border-radius: 10px;
      flex-grow: 1;
      overflow-y: auto;
    }
    
    .text-box {
      width: 100%;
      height: 50px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .submit-button {
      width: 100px;
      height: 40px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="message-container"></div>
  <form id="form">
    <input type="text" class="text-box" id="message-input" placeholder="Enter your test message here">
    <button class="submit-button">Submit</button>
    </form>
  </div>
</body>
</html>
