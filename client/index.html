<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <title>FalLUDOfields</title>
        <link rel="stylesheet" href="gameBoard.css">            
</head>

<body>
    <div class="board">
        <canvas tabindex='1' id="canvas" width="1500" height="1500" style="border:1px solid #000000;"></canvas>
    </div>

    <dialog id="dialog-box">
        <div id="dialog-container">
            <h3 id="dialog-h">Waiting for connection</h3>
            <p id="dialog-p">1</p>
            <div class="dice-wrapper">
                <img class="dice" src="dice-1.svg" id="die-1">
                <img class="dice" src="dice-2.svg" id="die-2">
            </div>
            <button id="roll-button">Roll</button>
        </div>
    </dialog>

    <script src="jquery-3.6.3.min.js"></script>
    <script src="jcanvas.min.js"></script>
    <script src="gameboard.js"></script>
</body>

</html>
